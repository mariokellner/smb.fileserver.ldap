name: Build and push container image
run-name: ${{ gitea.actor }} is building and pushing container image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-docker-image:
    runs-on: ubuntu-latest

    env:
      REGISTRY:  ${{ vars.PRIVATE_REGISTRY }}
      IMAGE_NAME: smb.fileserver.ldap
      NS: public
      IMG_PATH_GITEA: ${{ env.REGISTRY }}/${{ env.NS }}/${{ env.IMAGE_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: | 
            ${{ env.IMG_PATH_GITEA }}
          
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=raw,value=${{ github.sha }}
          labels: |
            org.opencontainers.image.authors="Mario Kellner"
            org.opencontainers.image.licenses="MIT"
            org.opencontainers.image.title="SMB Fileserver with LDAP Integration"
            org.opencontainers.image.url="https://www.kellner-digital.com"
            org.opencontainers.image.base.name="debian:bookworm-slim"

      - name: Login to Gitea Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          file: ./Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          platforms: linux/amd64,linux/arm64

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}