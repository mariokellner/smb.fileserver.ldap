name: Build and push container image
run-name: ${{ gitea.actor }} is building and pushing container image

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - '*'

jobs:
  build-docker-image:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      packages: write
      contents: read
      attestations: write
      artifact-metadata: write
    env:
      REGISTRY:  ${{ vars.PRIVATE_REGISTRY }}
      IMAGE_NAME: ${{ github.repository }}
      REPO: ${{ github.actor }}
      IMG_PATH: ${{ env.REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMG_PATH }}

      - name: Login to Gitea Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64

          tags: |
            ${{ env.IMG_PATH }}:latest
            ${{ env.IMG_PATH }}:${{ github.sha }}

          labels: |
            org.opencontainers.image.authors="Mario Kellner"
            org.opencontainers.image.source="https://git.homelab.kellner-digital.com/mario/samba_fileserver"
            org.opencontainers.image.description="This Container is meant to be used with LDAP Provider MOD to enable authentication from authentik instead of relaying on local users.\n It uses ldapsam+nslcd (pam) to sync the accounts from authentik and uses it as source."
            org.opencontainers.image.documentation="https://localhost"
            org.opencontainers.image.licenses="https://git.homelab.kellner-digital.com/mario/samba_fileserver/src/branch/main/LICENSE"
            org.opencontainers.image.revision="0.0.1"
            org.opencontainers.image.title="Samba LDAP For Authentik"
            org.opencontainers.image.url="https://www.kellner-digital.com"
            org.opencontainers.image.vendor="Mario Kellner"
            org.opencontainers.image.version="0.0.1"

      - name: Attest
        uses: actions/attest@v4
        id: attest
        with:
          subject-name: ${{ env.IMG_PATH }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
